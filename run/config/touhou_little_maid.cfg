# Configuration file

ai {
    # Secret API key (server-side config only) [default: ]
    S:chatApiKey=

    # Per-player chat cooldown [range: 1 ~ 300, default: 10]
    I:chatCooldownSeconds=10

    # Recent user/assistant messages kept per maid [range: 2 ~ 64, default: 16]
    I:chatHistorySize=16

    # OpenAI-compatible model name [default: gpt-4o-mini]
    S:chatModel=gpt-4o-mini

    # HTTP endpoint; leave blank to disable [default: ]
    S:chatServiceUrl=

    # External service connect/read timeout [range: 3 ~ 60, default: 30]
    I:chatTimeoutSeconds=30

    # Enable external AI chat service [default: false]
    B:enableMaidChat=false

    # Enable external TTS service [default: false]
    B:enableTts=false

    # TTS HTTP endpoint [default: ]
    S:ttsServiceUrl=
}


extras {

    miner {
        # Allow supported hammer-like tools to mine a protected 3x3 plane [default: true]
        B:minerAreaMining=true

        # Maximum block states checked per Maid work tick [range: 32 ~ 8192, default: 384]
        I:minerScanBudget=384

        # Horizontal ore-search radius [range: 1 ~ 32, default: 8]
        I:minerSearchRadius=8

        # Vertical ore-search radius [range: 1 ~ 16, default: 4]
        I:minerVerticalRange=4

        # Extra ore states: modid:block or modid:block@metadata [default: ]
        S:oreAllowList <
         >

        # Denied states; evaluated before adapters and OreDictionary [default: ]
        S:oreDenyList <
         >
    }

}


gameplay {
    # Square range in which scarecrows prevent fairy spawning [range: 0 ~ 256, default: 48]
    I:ScarecrowRange=48

    # Shrine Lamp displayed Power cost per hour [range: 0.0 ~ 3.4028235E38, default: 0.9]
    S:ShrineLampEffectCost=0.9

    # Maid Beacon Power Point absorption range [range: 0 ~ 256, default: 6]
    I:ShrineLampMaxRange=6

    # Maid Beacon maximum Power storage [range: 0.0 ~ 3.4028235E38, default: 100.0]
    S:ShrineLampMaxStorage=100.0

    # Only an owner may play against their maid [default: true]
    B:boardOwnerOnly=true
}


ids {
    # Legacy enchantment ID [range: 0 ~ 255, default: 127]
    I:endersEnderEnchantmentId=127

    # Legacy enchantment ID [range: 0 ~ 255, default: 125]
    I:impedingEnchantmentId=125

    # Legacy enchantment ID [range: 0 ~ 255, default: 126]
    I:speedyEnchantmentId=126
}


maid {
    # Ticks between rolling maid backups [range: 200 ~ 72000, default: 6000]
    I:backupIntervalTicks=6000

    # Allow following an owner between dimensions [default: true]
    B:crossDimensionFollow=true

    # Maximum tamed maids per owner [range: 1 ~ 1000, default: 20]
    I:maxMaidPerPlayer=20
}


spawn {
    # Fairy spawn weight; 0 disables natural spawning [range: 0 ~ 100, default: 8]
    I:fairySpawnWeight=8
}


vanilla {
    # Replace vanilla slime/magma cube with bundled Yukkuri models [default: true]
    B:ReplaceSlimeModel=true

    # Replace vanilla experience orbs with point items [default: true]
    B:ReplaceXPTexture=true
}


