buildscript {
    /* Репозитории Gradle-плагинов */
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        dependencies {
            classpath('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
                changing = true
            }
        }

    }
}


apply plugin: 'forge'
apply plugin: 'idea'

targetCompatibility = sourceCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = "TouhouLittleMaidMod-1.7.10"
group = "com.github.tartaricacid"
version = "0.1.0-port" + (project.hasProperty('artifactSuffix') ? "-${project.property('artifactSuffix')}" : "")

/*
 * The original 1.20 sources are intentionally kept in src/main/java as the
 * behavioural reference for the port.  Forge 1.7.10 cannot even parse a
 * number of language constructs used there and its Minecraft API is entirely
 * different, so the executable port lives in a separate source tree.
 */
sourceSets {
    engine {
        java {
            setSrcDirs(['src/main/java'])
            include 'com/github/tartaricacid/touhoulittlemaid/api/game/chess/**'
            include 'com/github/tartaricacid/touhoulittlemaid/api/game/xqwlight/**'
        }
    }
    main {
        java {
            setSrcDirs(['src/legacy/java'])
        }
        resources {
            setSrcDirs(['src/legacy/resources', 'src/main/resources'])
            exclude 'assets/touhou_little_maid/tlm_custom_pack/**'
        }
    }
}

/* Compile the two original, Minecraft-independent game engines separately so
 * their equally named Position/Search classes retain their package paths. */
sourceSets.main.compileClasspath += sourceSets.engine.output
sourceSets.main.runtimeClasspath += sourceSets.engine.output
compileJava.dependsOn engineClasses
jar.from sourceSets.engine.output

/* Вспомогательные конфиги для IDEA */
idea {
    module {
        inheritOutputDirs = true // Складываем *.class и assets в одну директорию, из разных Forge читать не будет
        excludeDirs += file('./run') // Исключаем директории из индексации
    }
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10' // Версия Forge
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude 'assets/touhou_little_maid/tlm_custom_pack/**'
    }

    /* 1.13+ uses textures/item; 1.7.10 looks up item icons in textures/items. */
    from('src/main/resources/assets/touhou_little_maid/textures/item') {
        into 'assets/touhou_little_maid/textures/items'
    }
    /* 1.13+ block texture folder is singular; 1.7.10 uses textures/blocks. */
    from('src/main/resources/assets/touhou_little_maid/textures/block') {
        into 'assets/touhou_little_maid/textures/blocks'
    }
    from('src/main/resources/assets/touhou_little_maid/textures/item') {
        include 'gomoku.png', 'cchess.png', 'wchess.png'
        into 'assets/touhou_little_maid/textures/blocks'
    }
    from('src/main/resources/assets/touhou_little_maid/textures/bedrock/block') {
        include 'altar.png'
        into 'assets/touhou_little_maid/textures/blocks'
    }
    /* The bundled 1.20 custom pack is stored as a nested resource pack. Copy
     * Peco's namespace to the jar root so the 1.7 sound engine can resolve it. */
    from('src/main/resources/assets/touhou_little_maid/tlm_custom_pack/touhou_little_maid-1.0.0/assets') {
        into 'assets'
    }
}

/* Dev версия мода без обфускации MC */
task devJar(type: Jar) {
    classifier = 'dev'
    manifest = jar.manifest
    from sourceSets.main.output
}

artifacts {
    archives devJar
}

repositories {
    flatDir {dirs "libs"}
    mavenCentral()
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    //// CodeChickenLib is in the Forge maven
    maven {
        name = "chickenbones"
        url = "http://chickenbones.net/maven/"
    }
}
